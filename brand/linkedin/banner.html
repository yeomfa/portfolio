<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Banner de LinkedIn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500&family=Atkinson+Hyperlegible+Mono:wght@400&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../tokens.css">
  <style>
    /* LinkedIn profile background: 1584 × 396. The profile photo covers the lower left
       on desktop and phones crop the sides, so the content sits centre-right. */
    html, body { margin: 0; overflow-x: clip; }
    body { width: 1584px; height: 396px; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
    .banner { position: relative; width: 1584px; height: 396px; overflow: hidden; }
    .content { position: absolute; left: 540px; right: 96px; top: 0; bottom: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--space-3xl); }
    .lead { display: grid; gap: var(--space-lg); padding-left: var(--space-xl); border-left: var(--rule-hair) solid var(--color-rule-2); position: relative; }
    .lead::before { content: ""; position: absolute; left: -4px; top: 14px; width: 7px; height: 7px; border-radius: 2px; background: var(--color-accent); }
    h1 { margin: 0; font-size: 64px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.02; overflow-wrap: break-word; min-width: 0; }
    .role { margin: 0; font-size: 22px; color: var(--color-ink-2); }
    .side { display: grid; justify-items: end; gap: var(--space-md); }
    .side img { height: 30px; width: auto; }
    .projects { margin: 0; padding: 0; list-style: none; display: grid; justify-items: end; gap: var(--space-3xs); font-size: 18px; color: var(--color-muted); }
  </style>
</head>
<body>
  <div class="banner">
    <div class="content">
      <div class="lead">
        <h1 data-es="Automatizo lo que<br>hoy es manual." data-en="I automate what’s<br>done by hand.">Automatizo lo que<br>hoy es manual.</h1>
        <p class="role" data-es="Ingeniero de IA y software en Colombia" data-en="AI and software engineer in Colombia">Ingeniero de IA y software en Colombia</p>
      </div>
      <div class="side">
        <img src="../logo/wordmark-dark.svg" width="637" height="94" alt="omaryesid.dev">
        <ul class="projects" aria-label="Proyectos">
          <li>ACUDA</li>
          <li>Mocta</li>
          <li>Kipun</li>
          <li>Tobot</li>
        </ul>
      </div>
    </div>
  </div>
  <script>
    const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'es';
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-es]').forEach((el) => { el.innerHTML = el.dataset[lang]; });
  </script>
</body>
</html>
